name: Bug
description: Something in the app doesn't work or looks wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: input
    id: where
    attributes:
      label: Page address
      description: The address of the page where it happened.
  - type: input
    id: device
    attributes:
      label: Device and browser
      description: For example "iPhone 14, Safari" or "Pixel 8, Chrome".
