name: harvest-youtube

# Every Monday: look for new live streams on the approved YouTube channels (scripts/youtube-channels.json)
# and open a pull request with them as "pending" cameras. Merging the PR and flipping a camera to
# "approved" are still done by the owner. Uses about 100 YouTube quota units per channel.
on:
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Find new streams
        env:
          YOU_TUBE_DATA_API_KEY: ${{ secrets.YOU_TUBE_DATA_API_KEY }}
        run: node scripts/harvest-youtube-channels.mjs --write
      - name: Open a pull request if anything new was found
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain data/cameras)" ]; then
            echo "Nothing new."
            exit 0
          fi
          branch="harvest/youtube-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/cameras
          git commit -m "Add new YouTube cameras found on approved channels (pending)"
          git push origin "$branch"
          gh pr create --title "New YouTube cameras (pending)" \
            --body "Found by the weekly harvest on channels listed in scripts/youtube-channels.json. Check each one looks right and fix its position, then set status to approved on the ones to show."
