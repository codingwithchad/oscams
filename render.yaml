# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: oscams
    runtime: node
    plan: free # switch to "starter" in the dashboard to stop the app sleeping when idle
    buildCommand: npm ci && npm run build
    startCommand: node build
    healthCheckPath: /healthz
    autoDeploy: true # redeploys on every push to main, including camera data changes
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: WSDOT_CODE
        sync: false # paste your WSDOT access code in the Render dashboard
